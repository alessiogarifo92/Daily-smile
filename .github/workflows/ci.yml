name: CI
on:
  # Public repo: standard-runner minutes are free, so every branch push is checked.
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same entry point as the local pre-push gate: typecheck, unit tests + coverage, build, e2e.
      - run: npm run verify

  # Deploys to Cloudflare once verify is green: main -> production, other branches -> preview URL.
  # Only on pushes to this repo (fork PRs never get secrets); skipped until the token is configured.
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README)."
          fi
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.ready == 'true'
        run: npm ci && npm run build
      - name: Deploy
        id: deploy
        if: steps.cf.outputs.ready == 'true'
        run: bash scripts/deploy.sh "$GITHUB_REF_NAME"
      - name: Smoke test on the deployed URL
        if: steps.cf.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: sleep 10 && bash scripts/smoke.sh "${{ steps.deploy.outputs.url }}"
