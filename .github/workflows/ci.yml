name: CI
on:
  # Public repo: standard-runner minutes are free, so every branch push is checked.
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same entry point as the local pre-push gate: typecheck, unit tests + coverage, build, e2e.
      - run: npm run verify
