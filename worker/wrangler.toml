name = "daily-smile"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The PWA build (npm run build -> dist/) is served by the same Worker: one origin, no CORS.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "daily-smile"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Every minute: deliver notifications that are due.
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:REPLACE_WITH_CONTACT_EMAIL"
# Secrets (not here): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY -> `npx wrangler secret put ...`
